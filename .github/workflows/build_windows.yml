name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            args: ""
            archive_suffix: "x64"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: |
          flutter config --enable-windows-desktop

      - name: Install Flutter Dependencies
        working-directory: aura_app
        run: |
          flutter pub get

      - name: Build Windows Executable (${{ matrix.target }})
        working-directory: aura_app
        run: |
          flutter build windows --release ${{ matrix.args }}

      - name: Package Windows Distribution
        shell: pwsh
        run: |
          $Version = "1.0.0"
          $DistDir = "dist"
          $StageDir = "$DistDir/YTDx-Studio-$Version-Windows-${{ matrix.archive_suffix }}"
          $ZipName = "YTDx-Studio-$Version-Windows-${{ matrix.archive_suffix }}.zip"

          New-Item -ItemType Directory -Force -Path $StageDir
          
          # Copy Flutter Release Bundle
          Copy-Item -Recurse -Force "aura_app/build/windows/x64/runner/Release/*" $StageDir/
          
          # Copy Python Core & Launcher
          Copy-Item -Recurse -Force "src" $StageDir/src
          Copy-Item -Force "requirements.txt" $StageDir/requirements.txt
          Copy-Item -Force "main.py" $StageDir/main.py
          Copy-Item -Force "LICENSE" $StageDir/LICENSE
          Copy-Item -Force "README.md" $StageDir/README.md
          Copy-Item -Recurse -Force "icons" $StageDir/icons

          # Create distribution zip
          Compress-Archive -Path "$StageDir/*" -DestinationPath "$DistDir/$ZipName" -Force
          Write-Host "Created: $DistDir/$ZipName"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTDx-Studio-Windows-${{ matrix.archive_suffix }}
          path: dist/*.zip
